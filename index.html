<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Os Achados — Ofertas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;color:#111}
header{background:#050505;color:#fff;padding:18px 5%;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.logo{font-size:25px;font-weight:900;white-space:nowrap}.logo span{color:#e50914}.search{flex:1;min-width:220px;padding:13px 18px;border:0;border-radius:9px;font-size:15px}
.categories{background:#111;color:#fff;padding:10px 5%;display:flex;gap:10px;overflow:auto}.categories button{background:#242424;color:#fff;border:1px solid #444;border-radius:20px;padding:9px 16px;white-space:nowrap;cursor:pointer}
main{max-width:1400px;margin:auto;padding:28px 5%}h1{margin:0 0 8px;font-size:30px}.sub{color:#666;margin-bottom:22px}
.notice{border:2px solid #e50914;border-radius:10px;padding:15px;text-align:center;background:#fff;font-weight:700;margin-bottom:25px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}select{padding:11px 14px;border-radius:8px;border:1px solid #ccc;background:#fff}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0001;display:flex;flex-direction:column}
.pic{height:180px;background:#eee;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:9px;left:9px;background:#ffd400;padding:5px 8px;border-radius:6px;font-size:11px;font-weight:900}.unbox{position:absolute;bottom:8px;left:8px;background:#e50914;color:#fff;border-radius:6px;padding:6px 8px;font-size:10px;font-weight:800}
.info{padding:13px;display:flex;flex-direction:column;gap:8px;flex:1}.store{font-size:11px;color:#e50914;font-weight:800}.name{font-size:14px;line-height:1.3;min-height:38px}.price{font-size:18px;font-weight:900}.buy{margin-top:auto;background:#111;color:#fff;border:0;border-radius:7px;padding:11px;cursor:pointer;font-weight:800}.buy:hover{background:#e50914}.empty{text-align:center;padding:45px;color:#666;grid-column:1/-1}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.pic{height:150px}h1{font-size:25px}}
</style></head>
<body>
<header><div class="logo">🔥 <span>OS ACHADOS</span></div><input id="search" class="search" placeholder="O que você está procurando?"></header>
<nav class="categories"><button onclick="setCategory('Todos')">Todos</button><button onclick="setCategory('Eletrônicos')">Eletrônicos</button><button onclick="setCategory('Casa')">Casa</button><button onclick="setCategory('Games')">Games</button><button onclick="setCategory('Moda')">Moda</button><button onclick="setCategory('Acessórios')">Acessórios</button></nav>
<main><h1>🔥 OS ACHADOS</h1><div class="sub">Produtos selecionados com preços e ofertas.</div><div class="notice">Clique no produto que você deseja e você será redirecionado pro site oficial</div>
<div class="top"><strong id="count"></strong><select id="store"><option value="Todos">Todas as lojas</option><option>Amazon</option><option>Mercado Livre</option><option>Shopee</option><option>Nike</option></select><select id="sort"><option value="relevant">Mais relevantes</option><option value="low">Menor preço</option><option value="high">Maior preço</option></select></div><div id="grid" class="grid"></div></main>
<script>
const products=[
{name:'Fone Bluetooth Sem Fio',price:89.9,store:'Amazon',cat:'Eletrônicos',img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80',url:'https://www.amazon.com.br/'},
{name:'Teclado Gamer Mecânico RGB',price:159.9,store:'Mercado Livre',cat:'Games',img:'https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=700&q=80',url:'https://www.mercadolivre.com.br/'},
{name:'Tênis Esportivo',price:199.9,store:'Nike',cat:'Moda',img:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80',url:'https://www.nike.com.br/'},
{name:'Smartwatch Inteligente',price:129.9,store:'Shopee',cat:'Acessórios',img:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=80',url:'https://shopee.com.br/'},
{name:'Luminária LED para Quarto',price:59.9,store:'Amazon',cat:'Casa',img:'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=700&q=80',url:'https://www.amazon.com.br/'},
{name:'Mouse Gamer RGB',price:79.9,store:'Mercado Livre',cat:'Games',img:'https://images.unsplash.com/photo-1527814050087-3793815479db?auto=format&fit=crop&w=700&q=80',url:'https://www.mercadolivre.com.br/'}
];
let category='Todos';const grid=document.getElementById('grid'),search=document.getElementById('search'),store=document.getElementById('store'),sort=document.getElementById('sort');
function setCategory(c){category=c;render()}function render(){let q=search.value.toLowerCase();let list=products.filter(p=>(category==='Todos'||p.cat===category)&&(store.value==='Todos'||p.store===store.value)&&p.name.toLowerCase().includes(q));if(sort.value==='low')list.sort((a,b)=>a.price-b.price);if(sort.value==='high')list.sort((a,b)=>b.price-a.price);document.getElementById('count').textContent=list.length+' produtos encontrados';grid.innerHTML=list.length?list.map(p=>'<article class="card"><div class="pic"><span class="badge">TOP</span><img src="'+p.img+'" alt="'+p.name+'"><span class="unbox">▶ Assistir Unboxing</span></div><div class="info"><div class="store">'+p.store+'</div><div class="name">'+p.name+'</div><div class="price">R$ '+p.price.toFixed(2).replace('.',',')+'</div><button class="buy" onclick="window.open(\''+p.url+'\',\'_blank\')">Comprar</button></div></article>').join(''):'<div class="empty">🙋 Não achou? Tente outra busca ou categoria.</div>'}search.addEventListener('input',render);store.addEventListener('change',render);sort.addEventListener('change',render);render();
</script></body></html>
